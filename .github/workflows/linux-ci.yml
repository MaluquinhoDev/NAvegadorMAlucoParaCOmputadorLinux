name: Linux extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate Firefox extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and package
        run: bash scripts/check-extension.sh

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: navegador-maluco-youtube-focus-firefox
          path: dist/youtube-focus-firefox.zip
          if-no-files-found: error
          retention-days: 14
