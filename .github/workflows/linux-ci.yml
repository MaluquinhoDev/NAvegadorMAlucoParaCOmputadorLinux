name: Linux desktop build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Test and build Debian package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 nodejs dpkg-dev zip xvfb

      - name: Validate Python and shell syntax
        run: |
          python3 -m compileall -q app tests
          bash -n scripts/build-deb.sh scripts/diagnose-performance.sh

      - name: Verify GTK and WebKitGTK bindings
        run: |
          /usr/bin/python3 -c "import gi; gi.require_version('Gtk', '3.0'); gi.require_version('WebKit2', '4.1'); from gi.repository import Gtk, WebKit2; print('GTK', Gtk.get_major_version(), 'WebKitGTK bindings loaded')"

      - name: Smoke-test desktop window
        run: |
          NM_SMOKE_TEST=1 xvfb-run -a /usr/bin/python3 - <<'PY'
          import sys
          import gi

          gi.require_version("Gtk", "3.0")
          gi.require_version("WebKit2", "4.1")
          from gi.repository import GLib, Gtk

          Gtk.init([])
          sys.path.insert(0, "app")
          from navegador_maluco import BrowserWindow

          window = BrowserWindow()
          window.show_all()
          GLib.idle_add(window.initialize_startup_tab)

          context = GLib.MainContext.default()
          while window.active_view() is None:
              context.iteration(True)

          assert window.active_view() is not None
          window.destroy()
          print("GTK/WebKitGTK browser window created")
          PY

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate Firefox extension prototype
        run: bash scripts/check-extension.sh

      - name: Build .deb package
        run: APP_VERSION=0.4.3 bash scripts/build-deb.sh

      - name: Inspect Debian package
        run: dpkg-deb --info dist/navegador-maluco_0.4.3_all.deb

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: navegador-maluco-linux-mint-deb
          path: dist/navegador-maluco_0.4.3_all.deb
          if-no-files-found: error
          retention-days: 90
